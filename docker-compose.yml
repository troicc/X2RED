services:
  x2red:
    image: python:3.12-slim
    working_dir: /workspace
    command: >-
      sh -c "pip install --no-build-isolation -e . &&
      x2red serve --host 0.0.0.0 --port 8787"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - .:/workspace
      - ./data:/workspace/data
    environment:
      X2RED_DATABASE_URL: sqlite:///./data/x2red.db
      X2RED_MEDIA_DIR: ./data/assets
      X2RED_RAW_DIR: ./data/raw
      X2RED_EXPORT_DIR: ./data/exports
