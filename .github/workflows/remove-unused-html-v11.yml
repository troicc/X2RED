name: Verify Guizang import cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify removed import
        run: |
          ! grep -q '^import html$' apps/api/app/services/guizang_native.py
