name: Targeted lint fix

on:
  push:
    branches: ["agent/light-content-lab-v12"]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply targeted lint fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/light-content-lab-v12
      - name: Apply exact lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          lab = Path("apps/api/app/services/light_content_lab.py")
          lab_text = lab.read_text(encoding="utf-8")
          old_import = "import json\nimport re\nimport zipfile"
          if old_import not in lab_text:
              raise SystemExit("expected light_content_lab import block not found")
          lab.write_text(
              lab_text.replace(old_import, "import json\nimport zipfile", 1),
              encoding="utf-8",
          )

          renderer = Path("apps/api/app/services/light_visual_renderer.py")
          renderer_text = renderer.read_text(encoding="utf-8")
          old_line = "            shade = 22 + layer * 7\n"
          if old_line not in renderer_text:
              raise SystemExit("expected unused shade assignment not found")
          renderer.write_text(renderer_text.replace(old_line, "", 1), encoding="utf-8")
          PY
      - name: Commit exact fixes
        run: |
          git config user.name "x2red-ci"
          git config user.email "x2red-ci@users.noreply.github.com"
          git add apps/api/app/services/light_content_lab.py apps/api/app/services/light_visual_renderer.py
          git commit -m "Apply targeted lint fixes"
          git push origin HEAD:agent/light-content-lab-v12
