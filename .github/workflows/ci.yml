name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q apps/api/app
      - run: pytest -q
      - name: Generate exact Ruff fixes
        run: |
          ruff check apps/api --fix
          git diff --check
          git diff -- apps/api
          git diff --exit-code
