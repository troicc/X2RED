[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x2red"
version = "0.12.0"
description = "Local-first Chinese content research, corpus, and multi-platform editorial studio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "httpx[socks]>=0.28,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "pillow>=11,<13",
  "apscheduler>=3.10,<4",
  "trafilatura>=2.1,<3",
  "playwright>=1.49,<2",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "mypy>=1.15,<2",
  "pip-audit>=2.8,<4",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
x2red = "app.cli:main"

[tool.setuptools]
package-dir = {"" = "apps/api"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.setuptools.package-data]
app = [
  "static/*",
  "vendor/native-skills/gc-minimal-zine-poster-v0-3/*",
  "vendor/native-skills/gc-minimal-zine-poster-v0-3/references/*",
  "vendor/native-skills/gc-minimal-zine-poster-v0-3/evals/*",
  "vendor/native-skills/gc-minimal-zine-poster-v0-3/examples/*",
]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"apps/api/app/services/guizang_native.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["apps/api/app"]

[tool.coverage.report]
fail_under = 70
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
skip_covered = true
show_missing = true
